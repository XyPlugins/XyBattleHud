# XyBattleHud 连击视图
# 放置位置：plugins/DragonCore/Gui/XyBattleHud连击视图.yml
# 服务端插件只负责计算连击数并调用“更新连击”；这里负责固定屏幕位置显示。

enable: true
match: hud

# 调位置只改 Functions 里的 取起点X / 取起点Y。
# w*0.65 表示屏幕宽度 65% 的位置，h*0.50 表示屏幕高度 50% 的位置。
# 数字固定预留 3 位，达到 10/100 连击时会向左增加数字，右侧“连击数”图片不乱跳。

数字:
  # 数字图片宽高，单位是屏幕像素。
  width: 14
  height: 18
  # 每个数字之间的间距。
  spacing: 1

标签:
  # “连击数”图片宽高，普攻为 连击数_1，暴击为 连击数_2。
  width: 42
  height: 14
  # 数字和“连击数”图片之间的间距。
  spacing: 3
  # 图片比数字低/高多少，负数往上，正数往下。
  yOffset: 4

图片:
  # 普攻连击数字 0-9 所在文件夹。
  普攻数字文件夹: 战斗视图/艾尔字体/普通伤害
  # 暴击连击数字 0-9 所在文件夹。
  暴击数字文件夹: 战斗视图/艾尔字体/暴击伤害
  # 普攻连击样式图。
  普攻标签: 战斗视图/伤害字体/连击数_1.png
  # 暴击连击样式图。
  暴击标签: 战斗视图/伤害字体/连击数_2.png

动画:
  # 最后多少毫秒开始淡出。
  淡出毫秒: 200

Functions:
  取起点X: return w*0.65;
  取起点Y: return h*0.50;
  取数字步长: return 方法.取Yaml值('数字.width') + 方法.取Yaml值('数字.spacing');
  是否显示: return 界面变量.连击显示 == true && 方法.取当前时间 < 界面变量.连击消失时间 && 界面变量.连击数量 > 0;
  取透明度: |-
    局部变量.剩余 = 界面变量.连击消失时间 - 方法.取当前时间;
    (局部变量.剩余 < 方法.取Yaml值('动画.淡出毫秒'))?{
      return 局部变量.剩余 / 方法.取Yaml值('动画.淡出毫秒');
    }:{
      return 1;
    };
  更新连击: |-
    界面变量.连击数量 = 方法.到整数(局部变量.参数.0);
    界面变量.连击暴击 = 局部变量.参数.1;
    局部变量.持续时间 = 方法.到整数(局部变量.参数.2);
    (局部变量.持续时间 <= 0)?{
      局部变量.持续时间 = 2000;
    }:{};
    界面变量.连击消失时间 = 方法.取当前时间 + 局部变量.持续时间;
    界面变量.连击显示 = true;

    界面变量.连击个位 = 方法.到整数(界面变量.连击数量 % 10);
    界面变量.连击十位 = 方法.到整数((界面变量.连击数量 / 10) % 10);
    界面变量.连击百位 = 方法.到整数((界面变量.连击数量 / 100) % 10);

    局部变量.数字文件夹 = 方法.取Yaml值('图片.普攻数字文件夹');
    局部变量.标签图片 = 方法.取Yaml值('图片.普攻标签');
    (界面变量.连击暴击 == 'true')?{
      局部变量.数字文件夹 = 方法.取Yaml值('图片.暴击数字文件夹');
      局部变量.标签图片 = 方法.取Yaml值('图片.暴击标签');
    }:{};

    方法.设置组件值('连击百位_texture', 'texture', 方法.合并文本(局部变量.数字文件夹, '/', 界面变量.连击百位, '.png'));
    方法.设置组件值('连击十位_texture', 'texture', 方法.合并文本(局部变量.数字文件夹, '/', 界面变量.连击十位, '.png'));
    方法.设置组件值('连击个位_texture', 'texture', 方法.合并文本(局部变量.数字文件夹, '/', 界面变量.连击个位, '.png'));
    方法.设置组件值('连击标签_texture', 'texture', 局部变量.标签图片);
  清除连击: |-
    界面变量.连击显示 = false;
    界面变量.连击数量 = 0;
    界面变量.连击消失时间 = 0;

连击百位_texture:
  x: 方法.执行方法('取起点X')
  y: 方法.执行方法('取起点Y')
  width: 方法.取Yaml值('数字.width')
  height: 方法.取Yaml值('数字.height')
  texture: 方法.合并文本(方法.取Yaml值('图片.普攻数字文件夹'), '/0.png')
  visible: 方法.执行方法('是否显示') && 界面变量.连击数量 >= 100
  alpha: 方法.执行方法('取透明度')
  z: 80

连击十位_texture:
  x: 方法.执行方法('取起点X') + 方法.执行方法('取数字步长')
  y: 方法.执行方法('取起点Y')
  width: 方法.取Yaml值('数字.width')
  height: 方法.取Yaml值('数字.height')
  texture: 方法.合并文本(方法.取Yaml值('图片.普攻数字文件夹'), '/0.png')
  visible: 方法.执行方法('是否显示') && 界面变量.连击数量 >= 10
  alpha: 方法.执行方法('取透明度')
  z: 80

连击个位_texture:
  x: 方法.执行方法('取起点X') + 方法.执行方法('取数字步长')*2
  y: 方法.执行方法('取起点Y')
  width: 方法.取Yaml值('数字.width')
  height: 方法.取Yaml值('数字.height')
  texture: 方法.合并文本(方法.取Yaml值('图片.普攻数字文件夹'), '/0.png')
  visible: 方法.执行方法('是否显示')
  alpha: 方法.执行方法('取透明度')
  z: 80

连击标签_texture:
  x: 方法.执行方法('取起点X') + 方法.执行方法('取数字步长')*3 + 方法.取Yaml值('标签.spacing')
  y: 方法.执行方法('取起点Y') + 方法.取Yaml值('标签.yOffset')
  width: 方法.取Yaml值('标签.width')
  height: 方法.取Yaml值('标签.height')
  texture: 方法.取Yaml值('图片.普攻标签')
  visible: 方法.执行方法('是否显示')
  alpha: 方法.执行方法('取透明度')
  z: 80
