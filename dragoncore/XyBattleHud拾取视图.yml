# XyBattleHud 拾取视图
# 放置位置：plugins/DragonCore/Gui/XyBattleHud拾取视图.yml
# 客户端图片：DragonCore/战斗视图/拾取视图/拾取框.png
# 灵魂空间图片：DragonCore/战斗视图/拾取视图/灵魂拾取框.png
# 品质图片：DragonCore/战斗视图/拾取视图/品质/下方配置的 PNG
# 服务端插件只负责发送物品缓存、来源和调用“创建拾取”；这里负责右下角显示。

enable: true
match: hud

图片:
  # 普通拾取、进入玩家背包时使用。
  普通拾取框: 战斗视图/拾取视图/拾取框.png
  # 自动进入灵魂空间时使用。
  灵魂空间拾取框: 战斗视图/拾取视图/灵魂拾取框.png
  # 是否根据物品名称或 Lore 中的品质关键词切换拾取框。
  # 关闭后只按普通拾取/灵魂空间来源选择框。
  品质拾取框启用: true

  # 下面的关键词沿用 ItemTip/通用.yml。
  # 图片路径留空时，不覆盖普通/灵魂空间框，适合还没准备对应 PNG 的情况。
  # 图片建议放在 DragonCore/战斗视图/拾取视图/品质/ 目录。
  品质判断词0: 待锻造
  品质拾取框0: ''
  品质判断词1: 白描
  品质拾取框1: ''
  品质判断词2: 萌黄
  品质拾取框2: ''
  品质判断词3: 群青
  品质拾取框3: ''
  品质判断词4: 气象
  品质拾取框4: ''
  品质判断词5: 极意
  品质拾取框5: ''
  品质判断词6: 归元
  品质拾取框6: ''
  品质判断词7: 传神
  品质拾取框7: ''
  品质判断词8: 无相
  品质拾取框8: ''
  品质判断词9: 浮世
  品质拾取框9: ''
  # 通用.yml 的第 10 项是 SDFASF，占位词，默认不启用。
  # 需要鸿蒙框时，把判断词10改成实际品质词，例如“传承”。
  品质判断词10: ''
  品质拾取框10: ''

Functions:
  创建拾取: |-
    方法.执行方法('全部上移');

    界面变量.当前序号 = 方法.到整数(界面变量.当前序号);
    局部变量.uuid = 局部变量.参数.0;
    局部变量.数量 = 局部变量.参数.1;
    局部变量.来源 = 局部变量.参数.2;
    局部变量.消失时间 = 方法.取当前时间 + 3000;
    局部变量.路径 = 方法.取Yaml值('图片.普通拾取框');
    (局部变量.来源 == 'soul')?{
      局部变量.路径 = 方法.取Yaml值('图片.灵魂空间拾取框');
    }:0;
    (方法.取Yaml值('图片.品质拾取框启用') == true)?{
      局部变量.物品 = 方法.取槽位物品('xybh_pickup_item_'&局部变量.uuid);
      (方法.取Yaml值('图片.品质判断词10') != '' && 方法.取Yaml值('图片.品质拾取框10') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词10')) > 0)?{
        局部变量.路径 = 方法.取Yaml值('图片.品质拾取框10');
      }:{
        (方法.取Yaml值('图片.品质判断词9') != '' && 方法.取Yaml值('图片.品质拾取框9') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词9')) > 0)?{
          局部变量.路径 = 方法.取Yaml值('图片.品质拾取框9');
        }:{
          (方法.取Yaml值('图片.品质判断词8') != '' && 方法.取Yaml值('图片.品质拾取框8') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词8')) > 0)?{
            局部变量.路径 = 方法.取Yaml值('图片.品质拾取框8');
          }:{
            (方法.取Yaml值('图片.品质判断词7') != '' && 方法.取Yaml值('图片.品质拾取框7') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词7')) > 0)?{
              局部变量.路径 = 方法.取Yaml值('图片.品质拾取框7');
            }:{
              (方法.取Yaml值('图片.品质判断词6') != '' && 方法.取Yaml值('图片.品质拾取框6') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词6')) > 0)?{
                局部变量.路径 = 方法.取Yaml值('图片.品质拾取框6');
              }:{
                (方法.取Yaml值('图片.品质判断词5') != '' && 方法.取Yaml值('图片.品质拾取框5') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词5')) > 0)?{
                  局部变量.路径 = 方法.取Yaml值('图片.品质拾取框5');
                }:{
                  (方法.取Yaml值('图片.品质判断词4') != '' && 方法.取Yaml值('图片.品质拾取框4') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词4')) > 0)?{
                    局部变量.路径 = 方法.取Yaml值('图片.品质拾取框4');
                  }:{
                    (方法.取Yaml值('图片.品质判断词3') != '' && 方法.取Yaml值('图片.品质拾取框3') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词3')) > 0)?{
                      局部变量.路径 = 方法.取Yaml值('图片.品质拾取框3');
                    }:{
                      (方法.取Yaml值('图片.品质判断词2') != '' && 方法.取Yaml值('图片.品质拾取框2') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词2')) > 0)?{
                        局部变量.路径 = 方法.取Yaml值('图片.品质拾取框2');
                      }:{
                        (方法.取Yaml值('图片.品质判断词1') != '' && 方法.取Yaml值('图片.品质拾取框1') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词1')) > 0)?{
                          局部变量.路径 = 方法.取Yaml值('图片.品质拾取框1');
                        }:{
                          (方法.取Yaml值('图片.品质判断词0') != '' && 方法.取Yaml值('图片.品质拾取框0') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词0')) > 0)?{
                            局部变量.路径 = 方法.取Yaml值('图片.品质拾取框0');
                          }:0;
                        };
                      };
                    };
                  };
                };
              };
            };
          };
        };
      };
    }:0;

    局部变量.背景 = 方法.新建组件('xybh_pickup_bg_' & 界面变量.当前序号 & '_texture', '拾取背景');
    方法.添加组件(局部变量.背景);
    局部变量.背景.index = 0;
    局部变量.背景.uuid = 局部变量.uuid;
    局部变量.背景.数量 = 局部变量.数量;
    局部变量.背景.来源 = 局部变量.来源;
    局部变量.背景.路径 = 局部变量.路径;
    局部变量.背景.消失时间 = 局部变量.消失时间;
    局部变量.背景.移动百分比 = 0;

    局部变量.物品 = 方法.新建组件('xybh_pickup_item_' & 界面变量.当前序号 & '_slot', '拾取物品');
    方法.添加组件(局部变量.物品);
    局部变量.物品.index = 0;
    局部变量.物品.uuid = 局部变量.uuid;
    局部变量.物品.数量 = 局部变量.数量;
    局部变量.物品.消失时间 = 局部变量.消失时间;
    局部变量.物品.移动百分比 = 0;

    局部变量.文字 = 方法.新建组件('xybh_pickup_text_' & 界面变量.当前序号 & '_label', '拾取文字');
    方法.添加组件(局部变量.文字);
    局部变量.文字.index = 0;
    局部变量.文字.uuid = 局部变量.uuid;
    局部变量.文字.数量 = 局部变量.数量;
    局部变量.文字.消失时间 = 局部变量.消失时间;
    局部变量.文字.移动百分比 = 0;

    界面变量.当前序号 = 界面变量.当前序号 + 1;

  全部上移: |-
    局部变量.索引 = 0;
    loop(方法.取成员数(方法.取所有组件()),{
      局部变量.组件 = 方法.取成员(方法.取所有组件(), 局部变量.索引);
      局部变量.组件.index = 方法.到整数(局部变量.组件.index + 1);
      局部变量.索引 = 局部变量.索引 + 1;
    });

# 调位置只改这里：
# x 里的 w-8 表示距离右边 8 像素；y 里的 h-74 表示距离底部 74 像素。
# 25 是多条拾取提示之间的上下间距。
# 50*(1-移动百分比) 是从右侧滑入的距离，不想滑动可删掉这一段。
拾取背景:
  x: "w-8-局部变量.当前组件.width+50*(1-局部变量.当前组件.移动百分比)"
  y: "h-74-方法.到整数(局部变量.当前组件.index)*25"
  width: 120
  height: 22
  texture: 局部变量.当前组件.路径
  alpha: |-
    (局部变量.当前组件.消失时间-方法.取当前时间 < 600)?{
      return (局部变量.当前组件.消失时间-方法.取当前时间)/600;
    }:{
      return 1;
    }
  actions:
    preRender: |-
      (方法.取当前时间 > 局部变量.当前组件.消失时间 || 局部变量.当前组件.index > 5)?{
        方法.移除组件(局部变量.当前组件);
      }:{};
      (局部变量.当前组件.移动百分比 < 1)?{
        局部变量.当前组件.移动百分比 = 局部变量.当前组件.移动百分比 + 0.08;
      }:{};

拾取物品:
  x: "w-8-120+4+50*(1-局部变量.当前组件.移动百分比)"
  y: "h-74+3-方法.到整数(局部变量.当前组件.index)*25"
  width: 16
  height: 16
  enable: false
  amount: ''
  identifier: "'xybh_pickup_item_'&局部变量.当前组件.uuid"
  alpha: |-
    (局部变量.当前组件.消失时间-方法.取当前时间 < 200)?{
      return (局部变量.当前组件.消失时间-方法.取当前时间)/200;
    }:{
      return 1;
    }
  actions:
    preRender: |-
      (方法.取当前时间 > 局部变量.当前组件.消失时间 || 局部变量.当前组件.index > 5)?{
        方法.删除物品('xybh_pickup_item_'&局部变量.当前组件.uuid);
        方法.移除组件(局部变量.当前组件);
      }:{};
      (局部变量.当前组件.移动百分比 < 1)?{
        局部变量.当前组件.移动百分比 = 局部变量.当前组件.移动百分比 + 0.08;
      }:{};

拾取文字:
  x: "w-8-120+25+50*(1-局部变量.当前组件.移动百分比)"
  y: "h-74+7-方法.到整数(局部变量.当前组件.index)*25"
  z: 60
  center: false
  scale: 0.85
  texts:
  - "方法.取物品名(方法.取槽位物品('xybh_pickup_item_'&局部变量.当前组件.uuid))&' &f+'&方法.到整数(局部变量.当前组件.数量)"
  alpha: |-
    (局部变量.当前组件.消失时间-方法.取当前时间 < 600)?{
      return (局部变量.当前组件.消失时间-方法.取当前时间)/600;
    }:{
      return 1;
    }
  strokeColor: 0,0,0
  actions:
    preRender: |-
      (方法.取当前时间 > 局部变量.当前组件.消失时间 || 局部变量.当前组件.index > 5)?{
        方法.移除组件(局部变量.当前组件);
      }:{};
      (局部变量.当前组件.移动百分比 < 1)?{
        局部变量.当前组件.移动百分比 = 局部变量.当前组件.移动百分比 + 0.08;
      }:{};
