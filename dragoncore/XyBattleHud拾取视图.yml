# XyBattleHud 拾取视图
# 放置位置：plugins/DragonCore/Gui/XyBattleHud拾取视图.yml
# 客户端图片：DragonCore/战斗视图/拾取视图/拾取框.png
# 服务端插件只负责发送物品缓存和调用“创建拾取”；这里负责右下角显示。

enable: true
match: hud

Functions:
  创建拾取: |-
    方法.执行方法('全部上移');

    界面变量.当前序号 = 方法.到整数(界面变量.当前序号);
    局部变量.uuid = 局部变量.参数.0;
    局部变量.数量 = 局部变量.参数.1;
    局部变量.消失时间 = 方法.取当前时间 + 3000;

    局部变量.背景 = 方法.新建组件('xybh_pickup_bg_' & 界面变量.当前序号 & '_texture', '拾取背景');
    方法.添加组件(局部变量.背景);
    局部变量.背景.index = 0;
    局部变量.背景.uuid = 局部变量.uuid;
    局部变量.背景.数量 = 局部变量.数量;
    局部变量.背景.消失时间 = 局部变量.消失时间;
    局部变量.背景.移动百分比 = 0;

    局部变量.物品 = 方法.新建组件('xybh_pickup_item_' & 界面变量.当前序号 & '_slot', '拾取物品');
    方法.添加组件(局部变量.物品);
    局部变量.物品.index = 0;
    局部变量.物品.uuid = 局部变量.uuid;
    局部变量.物品.数量 = 局部变量.数量;
    局部变量.物品.消失时间 = 局部变量.消失时间;
    局部变量.物品.移动百分比 = 0;

    局部变量.文字 = 方法.新建组件('xybh_pickup_text_' & 界面变量.当前序号 & '_label', '拾取文字');
    方法.添加组件(局部变量.文字);
    局部变量.文字.index = 0;
    局部变量.文字.uuid = 局部变量.uuid;
    局部变量.文字.数量 = 局部变量.数量;
    局部变量.文字.消失时间 = 局部变量.消失时间;
    局部变量.文字.移动百分比 = 0;

    界面变量.当前序号 = 界面变量.当前序号 + 1;

  全部上移: |-
    局部变量.索引 = 0;
    loop(方法.取成员数(方法.取所有组件()),{
      局部变量.组件 = 方法.取成员(方法.取所有组件(), 局部变量.索引);
      局部变量.组件.index = 方法.到整数(局部变量.组件.index + 1);
      局部变量.索引 = 局部变量.索引 + 1;
    });

# 调位置只改这里：
# x 里的 w-8 表示距离右边 8 像素；y 里的 h-74 表示距离底部 74 像素。
# 25 是多条拾取提示之间的上下间距。
# 50*(1-移动百分比) 是从右侧滑入的距离，不想滑动可删掉这一段。
拾取背景:
  x: "w-8-局部变量.当前组件.width+50*(1-局部变量.当前组件.移动百分比)"
  y: "h-74-方法.到整数(局部变量.当前组件.index)*25"
  width: 120
  height: 22
  texture: 战斗视图/拾取视图/拾取框.png
  alpha: |-
    (局部变量.当前组件.消失时间-方法.取当前时间 < 600)?{
      return (局部变量.当前组件.消失时间-方法.取当前时间)/600;
    }:{
      return 1;
    }
  actions:
    preRender: |-
      (方法.取当前时间 > 局部变量.当前组件.消失时间 || 局部变量.当前组件.index > 5)?{
        方法.移除组件(局部变量.当前组件);
      }:{};
      (局部变量.当前组件.移动百分比 < 1)?{
        局部变量.当前组件.移动百分比 = 局部变量.当前组件.移动百分比 + 0.08;
      }:{};

拾取物品:
  x: "w-8-120+4+50*(1-局部变量.当前组件.移动百分比)"
  y: "h-74+3-方法.到整数(局部变量.当前组件.index)*25"
  width: 16
  height: 16
  enable: false
  amount: ''
  identifier: "'xybh_pickup_item_'&局部变量.当前组件.uuid"
  alpha: |-
    (局部变量.当前组件.消失时间-方法.取当前时间 < 200)?{
      return (局部变量.当前组件.消失时间-方法.取当前时间)/200;
    }:{
      return 1;
    }
  actions:
    preRender: |-
      (方法.取当前时间 > 局部变量.当前组件.消失时间 || 局部变量.当前组件.index > 5)?{
        方法.删除物品('xybh_pickup_item_'&局部变量.当前组件.uuid);
        方法.移除组件(局部变量.当前组件);
      }:{};
      (局部变量.当前组件.移动百分比 < 1)?{
        局部变量.当前组件.移动百分比 = 局部变量.当前组件.移动百分比 + 0.08;
      }:{};

拾取文字:
  x: "w-8-120+25+50*(1-局部变量.当前组件.移动百分比)"
  y: "h-74+7-方法.到整数(局部变量.当前组件.index)*25"
  z: 60
  center: false
  scale: 0.85
  texts:
  - "方法.取物品名(方法.取槽位物品('xybh_pickup_item_'&局部变量.当前组件.uuid))&' &f+'&方法.到整数(局部变量.当前组件.数量)"
  alpha: |-
    (局部变量.当前组件.消失时间-方法.取当前时间 < 600)?{
      return (局部变量.当前组件.消失时间-方法.取当前时间)/600;
    }:{
      return 1;
    }
  strokeColor: 0,0,0
  actions:
    preRender: |-
      (方法.取当前时间 > 局部变量.当前组件.消失时间 || 局部变量.当前组件.index > 5)?{
        方法.移除组件(局部变量.当前组件);
      }:{};
      (局部变量.当前组件.移动百分比 < 1)?{
        局部变量.当前组件.移动百分比 = 局部变量.当前组件.移动百分比 + 0.08;
      }:{};
