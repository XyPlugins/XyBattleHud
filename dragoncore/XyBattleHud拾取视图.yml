# XyBattleHud 拾取视图
# 放置位置：plugins/DragonCore/Gui/XyBattleHud拾取视图.yml
# 默认图片：DragonCore/战斗视图/拾取视图/白描拾取框.png
# 默认灵魂图片：DragonCore/战斗视图/拾取视图/白描灵魂拾取框.png
# 品质图片：DragonCore/战斗视图/拾取视图/白描拾取框.png 等 PNG
# 服务端插件负责发送物品缓存、来源和调用“创建拾取”；这里负责右下角显示。
# 位置由 XyBattleHud config.yml -> pickup.position 控制。
# 淡出、堆叠层数和层间距由 XyBattleHud config.yml -> pickup.animation 控制。
# 当前客户端资源包的两套框视觉与来源相反：
# 普通背包显示带头颅的框，灵魂空间显示带箱子的框。

enable: true
match: hud

图片:
  # 两套基础框图片。创建拾取函数会按当前资源包的视觉习惯反向套用。
  普通拾取框: 战斗视图/拾取视图/白描拾取框.png
  # 经验/金币提示固定使用带头颅的普通背包样式，不参与品质框匹配。
  灵魂空间拾取框: 战斗视图/拾取视图/白描灵魂拾取框.png
  # 是否根据物品名称或 Lore 中的品质关键词切换拾取框。
  # 关闭后只按普通拾取/灵魂空间来源选择框。
  品质拾取框启用: true

  # 下面的关键词沿用 ItemTip/通用.yml。
  # 当前资源包命名和视觉相反：普通拾取框图片带箱子，灵魂拾取框图片带头颅。
  # 创建拾取时会反向套用，让背包拾取显示头颅框，灵魂空间显示箱子框。
  # 每个品质仍按文件名分别填写普通拾取框与灵魂空间拾取框。
  # 图片路径留空时，不覆盖普通/灵魂空间默认白描框，适合还没准备对应 PNG 的情况。
  品质判断词0: 待锻造
  # 待锻造和白描共用白描框。
  品质普通拾取框0: 战斗视图/拾取视图/白描拾取框.png
  品质灵魂拾取框0: 战斗视图/拾取视图/白描灵魂拾取框.png
  品质判断词1: 白描
  品质普通拾取框1: 战斗视图/拾取视图/白描拾取框.png
  品质灵魂拾取框1: 战斗视图/拾取视图/白描灵魂拾取框.png
  品质判断词2: 萌黄
  品质普通拾取框2: 战斗视图/拾取视图/萌黄拾取框.png
  品质灵魂拾取框2: 战斗视图/拾取视图/萌黄灵魂拾取框.png
  品质判断词3: 群青
  # 尚未提供群青图片，保持留空会自动回退默认白描框。
  品质普通拾取框3: ''
  品质灵魂拾取框3: ''
  品质判断词4: 气象
  品质普通拾取框4: 战斗视图/拾取视图/气象拾取框.png
  品质灵魂拾取框4: 战斗视图/拾取视图/气象灵魂拾取框.png
  品质判断词5: 极意
  品质普通拾取框5: 战斗视图/拾取视图/极意拾取框.png
  品质灵魂拾取框5: 战斗视图/拾取视图/极意灵魂拾取框.png
  品质判断词6: 归元
  品质普通拾取框6: 战斗视图/拾取视图/归元拾取框.png
  品质灵魂拾取框6: 战斗视图/拾取视图/归元灵魂拾取框.png
  品质判断词7: 传神
  品质普通拾取框7: 战斗视图/拾取视图/传神拾取框.png
  品质灵魂拾取框7: 战斗视图/拾取视图/传神灵魂拾取框.png
  品质判断词8: 无相
  # 尚未提供无相图片，保持留空会自动回退默认白描框。
  品质普通拾取框8: ''
  品质灵魂拾取框8: ''
  品质判断词9: 浮世
  品质普通拾取框9: 战斗视图/拾取视图/浮世拾取框.png
  品质灵魂拾取框9: 战斗视图/拾取视图/浮世灵魂拾取框.png
  # 通用.yml 的第 10 项是 SDFASF，占位词，默认不启用。
  # 需要鸿蒙框时，把判断词10改成实际品质词，例如“传承”。
  品质判断词10: ''
  品质普通拾取框10: ''
  品质灵魂拾取框10: ''

Functions:
  创建拾取: |-
    界面变量.当前序号 = 方法.到整数(界面变量.当前序号);
    局部变量.index = -1;
    局部变量.uuid = 局部变量.参数.0;
    局部变量.数量 = 局部变量.参数.1;
    局部变量.来源 = 局部变量.参数.2;
    局部变量.名称 = 局部变量.参数.3;
    局部变量.图标 = 局部变量.参数.4;
    局部变量.持续时间 = 方法.到整数(局部变量.参数.5);
    局部变量.淡入时间 = 方法.到整数(局部变量.参数.6);
    局部变量.淡出时间 = 方法.到整数(局部变量.参数.7);
    局部变量.最大数量 = 方法.到整数(局部变量.参数.8);
    局部变量.层间距 = 方法.到整数(局部变量.参数.9);
    局部变量.滑入距离 = 方法.到整数(局部变量.参数.10);
    局部变量.滑入速度 = 局部变量.参数.11;
    局部变量.上移速度 = 局部变量.参数.12;
    局部变量.右边距 = 方法.到整数(局部变量.参数.13);
    局部变量.底边距 = 方法.到整数(局部变量.参数.14);
    (局部变量.持续时间 <= 0)?{局部变量.持续时间 = 3000;}:0;
    (局部变量.淡入时间 < 0)?{局部变量.淡入时间 = 0;}:0;
    (局部变量.淡出时间 < 0)?{局部变量.淡出时间 = 0;}:0;
    (局部变量.最大数量 <= 0)?{局部变量.最大数量 = 5;}:0;
    (局部变量.层间距 <= 0)?{局部变量.层间距 = 25;}:0;
    (局部变量.滑入距离 < 0)?{局部变量.滑入距离 = 0;}:0;
    (局部变量.滑入速度 <= 0)?{局部变量.滑入速度 = 0.08;}:0;
    (局部变量.上移速度 <= 0)?{局部变量.上移速度 = 0.35;}:0;
    (局部变量.右边距 <= 0)?{局部变量.右边距 = 8;}:0;
    (局部变量.底边距 <= 0)?{局部变量.底边距 = 74;}:0;
    局部变量.出生时间 = 方法.取当前时间;
    局部变量.消失时间 = 局部变量.出生时间 + 局部变量.持续时间;
    局部变量.路径 = 方法.取Yaml值('图片.灵魂空间拾取框');
    局部变量.品质路径前缀 = '图片.品质灵魂拾取框';
    局部变量.文本模式 = false;
    (局部变量.来源 == 'experience' || 局部变量.来源 == 'money')?{
      局部变量.文本模式 = true;
      局部变量.路径 = 方法.取Yaml值('图片.灵魂空间拾取框');
      局部变量.品质路径前缀 = '';
    }:{
      (局部变量.来源 == 'soul')?{
        局部变量.路径 = 方法.取Yaml值('图片.普通拾取框');
        局部变量.品质路径前缀 = '图片.品质普通拾取框';
      }:{};
    };
    (局部变量.文本模式 != true && 方法.取Yaml值('图片.品质拾取框启用') == true)?{
      局部变量.物品 = 方法.取槽位物品('xybh_pickup_item_'&局部变量.uuid);
      (方法.取Yaml值('图片.品质判断词10') != '' && 方法.取Yaml值(局部变量.品质路径前缀&'10') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词10')) > 0)?{
        局部变量.路径 = 方法.取Yaml值(局部变量.品质路径前缀&'10');
      }:{
        (方法.取Yaml值('图片.品质判断词9') != '' && 方法.取Yaml值(局部变量.品质路径前缀&'9') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词9')) > 0)?{
          局部变量.路径 = 方法.取Yaml值(局部变量.品质路径前缀&'9');
        }:{
          (方法.取Yaml值('图片.品质判断词8') != '' && 方法.取Yaml值(局部变量.品质路径前缀&'8') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词8')) > 0)?{
            局部变量.路径 = 方法.取Yaml值(局部变量.品质路径前缀&'8');
          }:{
            (方法.取Yaml值('图片.品质判断词7') != '' && 方法.取Yaml值(局部变量.品质路径前缀&'7') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词7')) > 0)?{
              局部变量.路径 = 方法.取Yaml值(局部变量.品质路径前缀&'7');
            }:{
              (方法.取Yaml值('图片.品质判断词6') != '' && 方法.取Yaml值(局部变量.品质路径前缀&'6') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词6')) > 0)?{
                局部变量.路径 = 方法.取Yaml值(局部变量.品质路径前缀&'6');
              }:{
                (方法.取Yaml值('图片.品质判断词5') != '' && 方法.取Yaml值(局部变量.品质路径前缀&'5') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词5')) > 0)?{
                  局部变量.路径 = 方法.取Yaml值(局部变量.品质路径前缀&'5');
                }:{
                  (方法.取Yaml值('图片.品质判断词4') != '' && 方法.取Yaml值(局部变量.品质路径前缀&'4') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词4')) > 0)?{
                    局部变量.路径 = 方法.取Yaml值(局部变量.品质路径前缀&'4');
                  }:{
                    (方法.取Yaml值('图片.品质判断词3') != '' && 方法.取Yaml值(局部变量.品质路径前缀&'3') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词3')) > 0)?{
                      局部变量.路径 = 方法.取Yaml值(局部变量.品质路径前缀&'3');
                    }:{
                      (方法.取Yaml值('图片.品质判断词2') != '' && 方法.取Yaml值(局部变量.品质路径前缀&'2') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词2')) > 0)?{
                        局部变量.路径 = 方法.取Yaml值(局部变量.品质路径前缀&'2');
                      }:{
                        (方法.取Yaml值('图片.品质判断词1') != '' && 方法.取Yaml值(局部变量.品质路径前缀&'1') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词1')) > 0)?{
                          局部变量.路径 = 方法.取Yaml值(局部变量.品质路径前缀&'1');
                        }:{
                          (方法.取Yaml值('图片.品质判断词0') != '' && 方法.取Yaml值(局部变量.品质路径前缀&'0') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词0')) > 0)?{
                            局部变量.路径 = 方法.取Yaml值(局部变量.品质路径前缀&'0');
                          }:0;
                        };
                      };
                    };
                  };
                };
              };
            };
          };
        };
      };
    }:0;

    局部变量.背景 = 方法.新建组件('xybh_pickup_bg_' & 界面变量.当前序号 & '_texture', '拾取背景');
    方法.添加组件(局部变量.背景);
    局部变量.背景.index = 局部变量.index;
    局部变量.背景.uuid = 局部变量.uuid;
    局部变量.背景.数量 = 局部变量.数量;
    局部变量.背景.来源 = 局部变量.来源;
    局部变量.背景.路径 = 局部变量.路径;
    局部变量.背景.出生时间 = 局部变量.出生时间;
    局部变量.背景.消失时间 = 局部变量.消失时间;
    局部变量.背景.淡入时间 = 局部变量.淡入时间;
    局部变量.背景.淡出时间 = 局部变量.淡出时间;
    局部变量.背景.最大数量 = 局部变量.最大数量;
    局部变量.背景.层间距 = 局部变量.层间距;
    局部变量.背景.滑入距离 = 局部变量.滑入距离;
    局部变量.背景.滑入速度 = 局部变量.滑入速度;
    局部变量.背景.上移速度 = 局部变量.上移速度;
    局部变量.背景.右边距 = 局部变量.右边距;
    局部变量.背景.底边距 = 局部变量.底边距;
    局部变量.背景.移动百分比 = 0;

    (局部变量.文本模式 == true)?{
      (局部变量.来源 == 'money')?{
        局部变量.文本图标 = 方法.新建组件('xybh_pickup_money_icon_' & 界面变量.当前序号 & '_texture', '拾取金币图标');
      }:{
        局部变量.文本图标 = 方法.新建组件('xybh_pickup_exp_icon_' & 界面变量.当前序号 & '_texture', '拾取经验图标');
      };
      方法.添加组件(局部变量.文本图标);
      局部变量.文本图标.index = 局部变量.index;
      局部变量.文本图标.uuid = 局部变量.uuid;
      局部变量.文本图标.数量 = 局部变量.数量;
      局部变量.文本图标.图标 = 局部变量.图标;
      局部变量.文本图标.出生时间 = 局部变量.出生时间;
      局部变量.文本图标.消失时间 = 局部变量.消失时间;
      局部变量.文本图标.淡入时间 = 局部变量.淡入时间;
      局部变量.文本图标.淡出时间 = 局部变量.淡出时间;
      局部变量.文本图标.最大数量 = 局部变量.最大数量;
      局部变量.文本图标.层间距 = 局部变量.层间距;
      局部变量.文本图标.滑入距离 = 局部变量.滑入距离;
      局部变量.文本图标.滑入速度 = 局部变量.滑入速度;
      局部变量.文本图标.上移速度 = 局部变量.上移速度;
      局部变量.文本图标.右边距 = 局部变量.右边距;
      局部变量.文本图标.底边距 = 局部变量.底边距;
      局部变量.文本图标.移动百分比 = 0;

      局部变量.经验文字 = 方法.新建组件('xybh_pickup_exp_text_' & 界面变量.当前序号 & '_label', '拾取经验文字');
      方法.添加组件(局部变量.经验文字);
      局部变量.经验文字.index = 局部变量.index;
      局部变量.经验文字.uuid = 局部变量.uuid;
      局部变量.经验文字.数量 = 局部变量.数量;
      局部变量.经验文字.名称 = 局部变量.名称;
      局部变量.经验文字.出生时间 = 局部变量.出生时间;
      局部变量.经验文字.消失时间 = 局部变量.消失时间;
      局部变量.经验文字.淡入时间 = 局部变量.淡入时间;
      局部变量.经验文字.淡出时间 = 局部变量.淡出时间;
      局部变量.经验文字.最大数量 = 局部变量.最大数量;
      局部变量.经验文字.层间距 = 局部变量.层间距;
      局部变量.经验文字.滑入距离 = 局部变量.滑入距离;
      局部变量.经验文字.滑入速度 = 局部变量.滑入速度;
      局部变量.经验文字.上移速度 = 局部变量.上移速度;
      局部变量.经验文字.右边距 = 局部变量.右边距;
      局部变量.经验文字.底边距 = 局部变量.底边距;
      局部变量.经验文字.移动百分比 = 0;
    }:{
      局部变量.物品 = 方法.新建组件('xybh_pickup_item_' & 界面变量.当前序号 & '_slot', '拾取物品');
      方法.添加组件(局部变量.物品);
      局部变量.物品.index = 局部变量.index;
      局部变量.物品.uuid = 局部变量.uuid;
      局部变量.物品.数量 = 局部变量.数量;
      局部变量.物品.出生时间 = 局部变量.出生时间;
      局部变量.物品.消失时间 = 局部变量.消失时间;
      局部变量.物品.淡入时间 = 局部变量.淡入时间;
      局部变量.物品.淡出时间 = 局部变量.淡出时间;
      局部变量.物品.最大数量 = 局部变量.最大数量;
      局部变量.物品.层间距 = 局部变量.层间距;
      局部变量.物品.滑入距离 = 局部变量.滑入距离;
      局部变量.物品.滑入速度 = 局部变量.滑入速度;
      局部变量.物品.上移速度 = 局部变量.上移速度;
      局部变量.物品.右边距 = 局部变量.右边距;
      局部变量.物品.底边距 = 局部变量.底边距;
      局部变量.物品.移动百分比 = 0;

      局部变量.文字 = 方法.新建组件('xybh_pickup_text_' & 界面变量.当前序号 & '_label', '拾取文字');
      方法.添加组件(局部变量.文字);
      局部变量.文字.index = 局部变量.index;
      局部变量.文字.uuid = 局部变量.uuid;
      局部变量.文字.数量 = 局部变量.数量;
      局部变量.文字.出生时间 = 局部变量.出生时间;
      局部变量.文字.消失时间 = 局部变量.消失时间;
      局部变量.文字.淡入时间 = 局部变量.淡入时间;
      局部变量.文字.淡出时间 = 局部变量.淡出时间;
      局部变量.文字.最大数量 = 局部变量.最大数量;
      局部变量.文字.层间距 = 局部变量.层间距;
      局部变量.文字.滑入距离 = 局部变量.滑入距离;
      局部变量.文字.滑入速度 = 局部变量.滑入速度;
      局部变量.文字.上移速度 = 局部变量.上移速度;
      局部变量.文字.右边距 = 局部变量.右边距;
      局部变量.文字.底边距 = 局部变量.底边距;
      局部变量.文字.移动百分比 = 0;
    };

    界面变量.当前序号 = 界面变量.当前序号 + 1;
    方法.执行方法('全部上移');

  取透明度: |-
    局部变量.剩余 = 局部变量.当前组件.消失时间 - 方法.取当前时间;
    (局部变量.当前组件.淡出时间 > 0 && 局部变量.剩余 < 局部变量.当前组件.淡出时间)?{
      return 局部变量.剩余 / 局部变量.当前组件.淡出时间;
    }:{
      return 1;
    };

  刷新移动: |-
    (局部变量.当前组件.移动百分比 < 1)?{
      局部变量.当前组件.移动百分比 = 局部变量.当前组件.移动百分比 + 局部变量.当前组件.滑入速度;
      (局部变量.当前组件.移动百分比 > 1)?{
        局部变量.当前组件.移动百分比 = 1;
      }:0;
    }:0;

  全部上移: |-
    局部变量.索引 = 0;
    loop(方法.取成员数(方法.取所有组件()),{
      局部变量.组件 = 方法.取成员(方法.取所有组件(), 局部变量.索引);
      局部变量.组件.index = 方法.到整数(局部变量.组件.index + 1);
      局部变量.索引 = 局部变量.索引 + 1;
    });

