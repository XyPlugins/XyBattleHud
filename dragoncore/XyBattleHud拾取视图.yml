拾取文字:
  x: "w-局部变量.当前组件.右边距-方法.取Yaml值('布局.拾取框宽度')+方法.取Yaml值('布局.文字X')+局部变量.当前组件.滑入距离*(1-局部变量.当前组件.移动百分比)"
