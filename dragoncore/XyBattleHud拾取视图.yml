# XyBattleHud 拾取视图
# 放置位置：plugins/DragonCore/Gui/XyBattleHud拾取视图.yml
# 背景图片：DragonCore/战斗视图/拾取视图/拾取框.png
# 品质框图片沿用 ItemEffect.yml，叠加在背景左侧物品格内。
# 服务端插件负责发送物品缓存、来源和调用“创建拾取”；这里负责右下角显示。
# 位置由 XyBattleHud config.yml -> pickup.position 控制。
# 淡出、堆叠层数和层间距由 XyBattleHud config.yml -> pickup.animation 控制。
# 普通背包、灵魂空间、经验和金币现在共用同一张背景。

enable: true
match: hud

图片:
  # 新版统一拾取背景，原图尺寸为 169 x 41。
  拾取框: 战斗视图/拾取视图/拾取框.png

  # 是否根据物品名称或 Lore 叠加品质框。
  # 关闭后仍显示物品，只是不显示左侧品质框。
  品质框启用: true

  # 以下七项与 ItemEffect.yml 前七项保持一致。
  # 没有匹配到任何判断词时，品质框路径保持为空，不显示品质框。
  品质判断词0: 白描
  品质框0: icon/品质框/白描.gif
  品质判断词1: 传神
  品质框1: icon/品质框/传神.gif
  品质判断词2: 浮世
  品质框2: icon/品质框/浮世.gif
  品质判断词3: 极意
  品质框3: icon/品质框/极意.gif
  品质判断词4: 气象
  品质框4: icon/品质框/气象.gif
  品质判断词5: 青痕
  品质框5: icon/品质框/青痕.gif
  品质判断词6: 石墨
  品质框6: icon/品质框/石墨.gif

# 拾取框和内容大小分开调。
# 下面的 X/Y 都以拾取框左上角为基准，单位为像素。
# 改拾取框宽高只影响背景，不会再把物品、经验或金币图标拉伸。
布局:
  拾取框宽度: 90
  拾取框高度: 17

  # 有品质的物品才显示品质框；无品质物品不显示。
  品质框X: 3
  品质框Y: 0
  品质框宽度: 17
  品质框高度: 17

  # 物品图标，宽高相同就不会被拉成长方形。
  物品X: 5
  物品Y: 2
  物品宽度: 13
  物品高度: 13

  # 经验图标，和物品图标分开调。
  经验图标X: 10
  经验图标Y: 5
  经验图标宽度: 7
  经验图标高度: 7

  # 金币图标，和经验图标分开调。
  金币图标X: 10
  金币图标Y: 4
  金币图标宽度: 8
  金币图标高度: 8

  # 文字位置和大小。
  文字X: 22
  文字Y: 5
  文字大小: 0.85

Functions:
  创建拾取: |-
    界面变量.当前序号 = 方法.到整数(界面变量.当前序号);
    局部变量.index = -1;
    局部变量.uuid = 局部变量.参数.0;
    局部变量.数量 = 局部变量.参数.1;
    局部变量.来源 = 局部变量.参数.2;
    局部变量.名称 = 局部变量.参数.3;
    局部变量.图标 = 局部变量.参数.4;
    局部变量.持续时间 = 方法.到整数(局部变量.参数.5);
    局部变量.淡入时间 = 方法.到整数(局部变量.参数.6);
    局部变量.淡出时间 = 方法.到整数(局部变量.参数.7);
    局部变量.最大数量 = 方法.到整数(局部变量.参数.8);
    局部变量.层间距 = 方法.到整数(局部变量.参数.9);
    局部变量.滑入距离 = 方法.到整数(局部变量.参数.10);
    局部变量.滑入速度 = 局部变量.参数.11;
    局部变量.上移速度 = 局部变量.参数.12;
    局部变量.右边距 = 方法.到整数(局部变量.参数.13);
    局部变量.底边距 = 方法.到整数(局部变量.参数.14);
    (局部变量.持续时间 <= 0)?{局部变量.持续时间 = 3000;}:0;
    (局部变量.淡入时间 == 0)?{局部变量.淡入时间 = 150;}:0;
    (局部变量.淡入时间 < 0)?{局部变量.淡入时间 = 0;}:0;
    (局部变量.淡出时间 < 0)?{局部变量.淡出时间 = 0;}:0;
    (局部变量.最大数量 <= 0)?{局部变量.最大数量 = 5;}:0;
    (局部变量.层间距 <= 0)?{局部变量.层间距 = 30;}:0;
    (局部变量.层间距 == 43)?{局部变量.层间距 = 30;}:0;
    (局部变量.滑入距离 < 0)?{局部变量.滑入距离 = 0;}:0;
    (局部变量.滑入速度 <= 0)?{局部变量.滑入速度 = 0.08;}:0;
    (局部变量.上移速度 <= 0)?{局部变量.上移速度 = 0.35;}:0;
    (局部变量.右边距 <= 0)?{局部变量.右边距 = 8;}:0;
    (局部变量.底边距 <= 0)?{局部变量.底边距 = 74;}:0;
    局部变量.出生时间 = 方法.取当前时间;
    局部变量.消失时间 = 局部变量.出生时间 + 局部变量.持续时间;
    局部变量.路径 = 方法.取Yaml值('图片.拾取框');
    局部变量.品质路径 = '';
    局部变量.文本模式 = false;
    (局部变量.来源 == 'experience' || 局部变量.来源 == 'money')?{
      局部变量.文本模式 = true;
    }:{};
    (局部变量.文本模式 != true && 方法.取Yaml值('图片.品质框启用') == true)?{
      局部变量.物品 = 方法.取槽位物品('xybh_pickup_item_'&局部变量.uuid);
      (方法.取Yaml值('图片.品质判断词6') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词6')) > 0)?{
        局部变量.品质路径 = 方法.取Yaml值('图片.品质框6');
      }:{
        (方法.取Yaml值('图片.品质判断词5') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词5')) > 0)?{
          局部变量.品质路径 = 方法.取Yaml值('图片.品质框5');
        }:{
          (方法.取Yaml值('图片.品质判断词4') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词4')) > 0)?{
            局部变量.品质路径 = 方法.取Yaml值('图片.品质框4');
          }:{
            (方法.取Yaml值('图片.品质判断词3') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词3')) > 0)?{
              局部变量.品质路径 = 方法.取Yaml值('图片.品质框3');
            }:{
              (方法.取Yaml值('图片.品质判断词2') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词2')) > 0)?{
                局部变量.品质路径 = 方法.取Yaml值('图片.品质框2');
              }:{
                (方法.取Yaml值('图片.品质判断词1') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词1')) > 0)?{
                  局部变量.品质路径 = 方法.取Yaml值('图片.品质框1');
                }:{
                  (方法.取Yaml值('图片.品质判断词0') != '' && 方法.是否包含(局部变量.物品,方法.取Yaml值('图片.品质判断词0')) > 0)?{
                    局部变量.品质路径 = 方法.取Yaml值('图片.品质框0');
                  }:0;
                };
              };
            };
          };
        };
      };
    }:0;

    局部变量.背景 = 方法.新建组件('xybh_pickup_bg_' & 界面变量.当前序号 & '_texture', '拾取背景');
    方法.添加组件(局部变量.背景);
    局部变量.背景.index = 局部变量.index;
    局部变量.背景.uuid = 局部变量.uuid;
    局部变量.背景.数量 = 局部变量.数量;
    局部变量.背景.来源 = 局部变量.来源;
    局部变量.背景.路径 = 局部变量.路径;
    局部变量.背景.出生时间 = 局部变量.出生时间;
    局部变量.背景.消失时间 = 局部变量.消失时间;
    局部变量.背景.淡入时间 = 局部变量.淡入时间;
    局部变量.背景.淡出时间 = 局部变量.淡出时间;
    局部变量.背景.最大数量 = 局部变量.最大数量;
    局部变量.背景.层间距 = 局部变量.层间距;
    局部变量.背景.滑入距离 = 局部变量.滑入距离;
    局部变量.背景.滑入速度 = 局部变量.滑入速度;
    局部变量.背景.上移速度 = 局部变量.上移速度;
    局部变量.背景.右边距 = 局部变量.右边距;
    局部变量.背景.底边距 = 局部变量.底边距;
    局部变量.背景.移动百分比 = 0;

    (局部变量.文本模式 != true && 局部变量.品质路径 != '')?{
      局部变量.品质框 = 方法.新建组件('xybh_pickup_quality_' & 界面变量.当前序号 & '_texture', '拾取品质框');
      方法.添加组件(局部变量.品质框);
      局部变量.品质框.index = 局部变量.index;
      局部变量.品质框.uuid = 局部变量.uuid;
      局部变量.品质框.路径 = 局部变量.品质路径;
      局部变量.品质框.出生时间 = 局部变量.出生时间;
      局部变量.品质框.消失时间 = 局部变量.消失时间;
      局部变量.品质框.淡入时间 = 局部变量.淡入时间;
      局部变量.品质框.淡出时间 = 局部变量.淡出时间;
      局部变量.品质框.最大数量 = 局部变量.最大数量;
      局部变量.品质框.层间距 = 局部变量.层间距;
      局部变量.品质框.滑入距离 = 局部变量.滑入距离;
      局部变量.品质框.滑入速度 = 局部变量.滑入速度;
      局部变量.品质框.上移速度 = 局部变量.上移速度;
      局部变量.品质框.右边距 = 局部变量.右边距;
      局部变量.品质框.底边距 = 局部变量.底边距;
      局部变量.品质框.移动百分比 = 0;
    }:0;

    (局部变量.文本模式 == true)?{
      (局部变量.来源 == 'money')?{
        局部变量.文本图标 = 方法.新建组件('xybh_pickup_money_icon_' & 界面变量.当前序号 & '_texture', '拾取金币图标');
      }:{
        局部变量.文本图标 = 方法.新建组件('xybh_pickup_exp_icon_' & 界面变量.当前序号 & '_texture', '拾取经验图标');
      };
      方法.添加组件(局部变量.文本图标);
      局部变量.文本图标.index = 局部变量.index;
      局部变量.文本图标.uuid = 局部变量.uuid;
      局部变量.文本图标.数量 = 局部变量.数量;
      局部变量.文本图标.图标 = 局部变量.图标;
      局部变量.文本图标.出生时间 = 局部变量.出生时间;
      局部变量.文本图标.消失时间 = 局部变量.消失时间;
      局部变量.文本图标.淡入时间 = 局部变量.淡入时间;
      局部变量.文本图标.淡出时间 = 局部变量.淡出时间;
      局部变量.文本图标.最大数量 = 局部变量.最大数量;
      局部变量.文本图标.层间距 = 局部变量.层间距;
      局部变量.文本图标.滑入距离 = 局部变量.滑入距离;
      局部变量.文本图标.滑入速度 = 局部变量.滑入速度;
      局部变量.文本图标.上移速度 = 局部变量.上移速度;
      局部变量.文本图标.右边距 = 局部变量.右边距;
      局部变量.文本图标.底边距 = 局部变量.底边距;
      局部变量.文本图标.移动百分比 = 0;

      局部变量.经验文字 = 方法.新建组件('xybh_pickup_exp_text_' & 界面变量.当前序号 & '_label', '拾取经验文字');
      方法.添加组件(局部变量.经验文字);
      局部变量.经验文字.index = 局部变量.index;
      局部变量.经验文字.uuid = 局部变量.uuid;
      局部变量.经验文字.数量 = 局部变量.数量;
      局部变量.经验文字.名称 = 局部变量.名称;
      局部变量.经验文字.出生时间 = 局部变量.出生时间;
      局部变量.经验文字.消失时间 = 局部变量.消失时间;
      局部变量.经验文字.淡入时间 = 局部变量.淡入时间;
      局部变量.经验文字.淡出时间 = 局部变量.淡出时间;
      局部变量.经验文字.最大数量 = 局部变量.最大数量;
      局部变量.经验文字.层间距 = 局部变量.层间距;
      局部变量.经验文字.滑入距离 = 局部变量.滑入距离;
      局部变量.经验文字.滑入速度 = 局部变量.滑入速度;
      局部变量.经验文字.上移速度 = 局部变量.上移速度;
      局部变量.经验文字.右边距 = 局部变量.右边距;
      局部变量.经验文字.底边距 = 局部变量.底边距;
      局部变量.经验文字.移动百分比 = 0;
    }:{
      局部变量.物品 = 方法.新建组件('xybh_pickup_item_' & 界面变量.当前序号 & '_slot', '拾取物品');
      方法.添加组件(局部变量.物品);
      局部变量.物品.index = 局部变量.index;
      局部变量.物品.uuid = 局部变量.uuid;
      局部变量.物品.数量 = 局部变量.数量;
      局部变量.物品.出生时间 = 局部变量.出生时间;
      局部变量.物品.消失时间 = 局部变量.消失时间;
      局部变量.物品.淡入时间 = 局部变量.淡入时间;
      局部变量.物品.淡出时间 = 局部变量.淡出时间;
      局部变量.物品.最大数量 = 局部变量.最大数量;
      局部变量.物品.层间距 = 局部变量.层间距;
      局部变量.物品.滑入距离 = 局部变量.滑入距离;
      局部变量.物品.滑入速度 = 局部变量.滑入速度;
      局部变量.物品.上移速度 = 局部变量.上移速度;
      局部变量.物品.右边距 = 局部变量.右边距;
      局部变量.物品.底边距 = 局部变量.底边距;
      局部变量.物品.移动百分比 = 0;

      局部变量.文字 = 方法.新建组件('xybh_pickup_text_' & 界面变量.当前序号 & '_label', '拾取文字');
      方法.添加组件(局部变量.文字);
      局部变量.文字.index = 局部变量.index;
      局部变量.文字.uuid = 局部变量.uuid;
      局部变量.文字.数量 = 局部变量.数量;
      局部变量.文字.出生时间 = 局部变量.出生时间;
      局部变量.文字.消失时间 = 局部变量.消失时间;
      局部变量.文字.淡入时间 = 局部变量.淡入时间;
      局部变量.文字.淡出时间 = 局部变量.淡出时间;
      局部变量.文字.最大数量 = 局部变量.最大数量;
      局部变量.文字.层间距 = 局部变量.层间距;
      局部变量.文字.滑入距离 = 局部变量.滑入距离;
      局部变量.文字.滑入速度 = 局部变量.滑入速度;
      局部变量.文字.上移速度 = 局部变量.上移速度;
      局部变量.文字.右边距 = 局部变量.右边距;
      局部变量.文字.底边距 = 局部变量.底边距;
      局部变量.文字.移动百分比 = 0;
    };

    界面变量.当前序号 = 界面变量.当前序号 + 1;
    方法.执行方法('全部上移');

  取透明度: |-
    局部变量.已经显示 = 方法.取当前时间 - 局部变量.当前组件.出生时间;
    (局部变量.当前组件.淡入时间 > 0 && 局部变量.已经显示 < 局部变量.当前组件.淡入时间)?{
      return 局部变量.已经显示 / 局部变量.当前组件.淡入时间;
    }:{};
    局部变量.剩余 = 局部变量.当前组件.消失时间 - 方法.取当前时间;
    (局部变量.当前组件.淡出时间 > 0 && 局部变量.剩余 < 局部变量.当前组件.淡出时间)?{
      return 局部变量.剩余 / 局部变量.当前组件.淡出时间;
    }:{
      return 1;
    };

  刷新移动: |-
    (局部变量.当前组件.移动百分比 < 1)?{
      局部变量.当前组件.移动百分比 = 局部变量.当前组件.移动百分比 + 局部变量.当前组件.滑入速度;
      (局部变量.当前组件.移动百分比 > 1)?{
        局部变量.当前组件.移动百分比 = 1;
      }:0;
    }:0;

  全部上移: |-
    局部变量.索引 = 0;
    loop(方法.取成员数(方法.取所有组件()),{
      局部变量.组件 = 方法.取成员(方法.取所有组件(), 局部变量.索引);
      局部变量.组件.index = 方法.到整数(局部变量.组件.index + 1);
      局部变量.索引 = 局部变量.索引 + 1;
    });

# 调位置现在改服务端 config.yml：
# pickup.position.right 表示距离右边多少像素；pickup.position.bottom 表示距离底部多少像素。
# 层间距、滑入距离和淡出时间都由服务端 config.yml -> pickup.animation 发来。
# 当前 90 x 17 布局建议在服务端 config.yml 使用 stack-spacing: 30。
拾取背景:
  x: "w-局部变量.当前组件.右边距-方法.取Yaml值('布局.拾取框宽度')+局部变量.当前组件.滑入距离*(1-局部变量.当前组件.移动百分比)"
  y: "h-局部变量.当前组件.底边距-方法.到整数(局部变量.当前组件.index)*局部变量.当前组件.层间距"
  width: 方法.取Yaml值('布局.拾取框宽度')
  height: 方法.取Yaml值('布局.拾取框高度')
  texture: 局部变量.当前组件.路径
  alpha: 方法.执行方法('取透明度')
  actions:
    preRender: |-
      (方法.取当前时间 > 局部变量.当前组件.消失时间 || 局部变量.当前组件.index >= 局部变量.当前组件.最大数量)?{
        方法.移除组件(局部变量.当前组件);
      }:{};
      方法.执行方法('刷新移动');

# 品质框按“布局”里的独立坐标套入左侧物品格。
# 没有品质的物品不会创建此组件。
拾取品质框:
  x: "w-局部变量.当前组件.右边距-方法.取Yaml值('布局.拾取框宽度')+方法.取Yaml值('布局.品质框X')+局部变量.当前组件.滑入距离*(1-局部变量.当前组件.移动百分比)"
  y: "h-局部变量.当前组件.底边距+方法.取Yaml值('布局.品质框Y')-方法.到整数(局部变量.当前组件.index)*局部变量.当前组件.层间距"
  width: 方法.取Yaml值('布局.品质框宽度')
  height: 方法.取Yaml值('布局.品质框高度')
  texture: 局部变量.当前组件.路径
  alpha: 方法.执行方法('取透明度')
  actions:
    preRender: |-
      (方法.取当前时间 > 局部变量.当前组件.消失时间 || 局部变量.当前组件.index >= 局部变量.当前组件.最大数量)?{
        方法.移除组件(局部变量.当前组件);
      }:{};
      方法.执行方法('刷新移动');

拾取物品:
  x: "w-局部变量.当前组件.右边距-方法.取Yaml值('布局.拾取框宽度')+方法.取Yaml值('布局.物品X')+局部变量.当前组件.滑入距离*(1-局部变量.当前组件.移动百分比)"
  y: "h-局部变量.当前组件.底边距+方法.取Yaml值('布局.物品Y')-方法.到整数(局部变量.当前组件.index)*局部变量.当前组件.层间距"
  width: 方法.取Yaml值('布局.物品宽度')
  height: 方法.取Yaml值('布局.物品高度')
  enable: false
  amount: ''
  identifier: "'xybh_pickup_item_'&局部变量.当前组件.uuid"
  alpha: 方法.执行方法('取透明度')
  actions:
    preRender: |-
      (方法.取当前时间 > 局部变量.当前组件.消失时间 || 局部变量.当前组件.index >= 局部变量.当前组件.最大数量)?{
        方法.删除物品('xybh_pickup_item_'&局部变量.当前组件.uuid);
        方法.移除组件(局部变量.当前组件);
      }:{};
      方法.执行方法('刷新移动');

