plugins {
    id 'java'
}

group = 'org.xyplugin'
version = '1.3.3'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files('libs/paper-api-1.12.2-R0.1-SNAPSHOT.jar')
    compileOnly files('libs/bungeecord-chat-1.12-SNAPSHOT.jar')
    compileOnly files('libs/XyCore-0.3.3.jar')
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    archiveFileName = "XyBattleHud-${project.version}.jar"
    manifest {
        attributes('Implementation-Title': 'XyBattleHud', 'Implementation-Version': project.version)
    }
}
