name: XyBattleHud
version: '1.3.1'
main: org.xyplugin.xybattlehud.XyBattleHudPlugin
api-version: '1.12'
author: XyPlugin
description: Attribute damage, combo and pickup HUD for DragonCore clients
softdepend: [XyCore, AttributePlus, PlaceholderAPI, DragonCore, XySoulSpace, AkariLevel]

commands:
  xybh:
    description: XyBattleHud 管理命令
    usage: /xybh <reload|info|clear|debug>

permissions:
  xybattlehud.admin:
    description: 允许管理 XyBattleHud
    default: op
