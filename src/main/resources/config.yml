# XyBattleHud 1.3.12
# 伤害数字由服务端发送字符，DragonCore 字体配置负责把字符画成图片。

# 伤害数字显示设置。
display:
  # 伤害飘字渲染方式。
  # armorstand = 原版实体名字，兼容最好，但字体图片会带原版黑影。
  # dragoncore-headtag = 使用 DragonCore HeadTag 的 label 显示，可通过 shadow: false 去掉黑影。
  # 使用 dragoncore-headtag 时，需要把 dragoncore/HeadTag/XyBattleHud伤害飘字.yml 放到 plugins/DragonCore/HeadTag/。
  renderer: 'dragoncore-headtag'
  # 给 DragonCore HeadTag 识别用的实体名前缀；如果改这里，HeadTag YML 里的 match 和替换内容也要一起改。
  headtag-marker: 'XYBH_DAMAGE:'
  # 显示时长，20 tick = 1 秒。
  duration-ticks: 40
  # 相对受击目标眼睛的高度。
  height-offset: 0.45
  # 每 tick 向上移动的距离。
  float-speed: 0.025
  # 随机散开范围，填 0 表示不随机。
  random-offset: 0.35
  # 同时存在的伤害飘字上限。
  max-holograms: 100

# 伤害数值格式。
number:
  # 小数位数。默认整数，避免未配置小数点图片时出现原版字符。
  decimal-places: 0
  # 千位分隔符，留空表示关闭。
  thousands-separator: ''
  # 低于该数值的伤害不显示。
  min-damage: 0.1

# 连击设置。使用 DragonCore HUD 固定在屏幕位置，不再跟随怪物漂浮。
combo:
  # 是否启用连击。
  enabled: true
  # 两次命中最多间隔多久，40 tick = 2 秒。
  timeout-ticks: 40
  # 从第几连击开始显示。
  display-from: 2
  # 最大连击数，达到 999 后不再增加。
  max-count: 999

  # DragonCore Gui 文件名，不需要写 .yml。
  # 需要把仓库里的 dragoncore/XyBattleHud连击视图.yml 放到 plugins/DragonCore/Gui/。
  hud-name: 'XyBattleHud连击视图'
  # DragonCore HUD 里负责刷新连击数量的函数名。
  update-function: '更新连击'
  # DragonCore HUD 里负责隐藏连击的函数名。
  clear-function: '清除连击'

# 拾取视图设置。物品图标、名字和数量由 DragonCore HUD 显示。
pickup:
  # 是否启用右下角拾取提示。
  enabled: true
  # 是否显示物品自动进入灵魂空间时的拾取提示。
  soul-space-enabled: true
  # 是否向 HUD 保留“灵魂空间”来源标记。
  # 新版统一拾取框暂不区分来源，保留此项用于兼容旧 HUD。
  soul-space-frame-enabled: true
  # DragonCore Gui 文件名，不需要写 .yml。
  # 需要把仓库里的 dragoncore/XyBattleHud拾取视图.yml 放到 plugins/DragonCore/Gui/。
  # 按品质叠加物品格边框的关键词和 GIF，也在这个 DragonCore 文件的“图片”段配置。
  hud-name: 'XyBattleHud拾取视图'
  # DragonCore HUD 里负责创建拾取框的函数名。
  function-name: '创建拾取'
  # 发给客户端的临时物品缓存前缀。一般不要修改，除非和其他插件冲突。
  cache-prefix: 'xybh_pickup_item_'

  position:
    # 拾取框距离屏幕右边多少像素。数值越大，整体越往左。
    right: 50
    # 拾取框距离屏幕底部多少像素。数值越大，整体越往上。
    bottom: 74

  animation:
    # 单条拾取提示总显示多久，1000 毫秒 = 1 秒。
    duration-millis: 3000
    # 新提示出现时的淡入时间，150 毫秒比较自然。
    # 旧配置里的 0 会自动按 150 处理；填 -1 才表示完全关闭淡入。
    fade-in-millis: 150
    # 提示消失前的淡出时间，填 0 表示不淡出。
    fade-out-millis: 600
    # 屏幕上最多保留几条拾取提示；新的在最下面，旧的向上叠。
    max-entries: 5
    # 每层提示之间的上下间距，单位是像素。
    # 当前拾取框显示高度为 18，填写 22 会保留少量空隙，不会离得太远。
    stack-spacing: 22
    # 新提示从右侧滑入的距离，填 0 表示不滑入。
    slide-pixels: 50
    # 新提示滑入速度，0.01 很慢，1.0 立即到位。
    slide-speed: 0.08
    # 旧提示被顶到上一层时的移动速度。稳定队列模式下暂不使用，保留给后续平滑动画。
    stack-move-speed: 0.35

  experience:
    # 是否显示经验拾取提示。
    enabled: true
    # 经验提示使用统一拾取框，不参与物品品质框匹配。
    # 是否接入 AkariLevel 的经验变更事件。
    akari-level-enabled: true
    # 提供经验事件的插件名。默认 AkariLevel。
    provider-plugin: 'AkariLevel'
    # 经验事件类名。一般不用改，除非等级插件升级后改了事件路径。
    event-class: 'top.cpjinan.akarilevel.event.MemberExpChangeEvent'
    # 下面是事件里的变量名，不是图片路径。变量名改了就改这里，不用改代码。
    player-variable: 'member'
    amount-variable: 'expAmount'
    level-group-variable: 'levelGroup'
    source-variable: 'source'
    # 只显示这个等级组的经验；留空表示全部等级组都显示。
    level-group: ''
    # 只接收这些来源；留空表示全部来源都显示。
    # 例如：VANILLA_EXP_CHANGE、MYTHICMOBS_DROP_EXP
    sources: []
    # 经验提示里显示的名字。
    display-name: '经验'
    # 经验图标路径，直接改这里就行。
    icon: '战斗视图/属性图标/经验加成图标.png'
    # 同一笔经验有些情况下会被等级插件连续抛两遍；短时间内同玩家同数值只显示一次。
    # 填 0 表示关闭合并。正常不用改，若仍重复可稍微调大。
    dedupe-millis: 250

  money:
    # 是否显示 MythicMobs money 掉落的金币提示。
    enabled: true
    # 是否接入 MythicMobs 的掉落事件。Vault 只负责实际发钱，不直接监听余额变化。
    mythicmobs-enabled: true
    # MythicMobs 插件名。一般不用改。
    provider-plugin: 'MythicMobs'
    # 金币提示里显示的名字。
    display-name: '金币'
    # 金币图标路径，客户端需要准备这个 PNG；没有图标就改成你已有的路径。
    icon: '战斗视图/属性图标/金币图标.png'
    # 同一只怪同一笔 money 掉落短时间内只显示一次，避免事件重复触发。
    # 填 0 表示关闭合并。
    dedupe-millis: 250

# 过滤设置。
filter:
  # 是否忽略玩家对自己的伤害。
  ignore-self-damage: true
  # 不显示伤害的世界，默认不限制。
  ignored-worlds: []
  # 不显示伤害的实体类型。
  ignored-entity-types: [ARMOR_STAND]

# AttributePlus 接入设置。
attribute:
  # 安装 XyCore 时优先使用其属性接口，否则直接读取 AttributePlus。
  prefer-xycore: true
  # 常驻属性值大于该数值时才算匹配。
  threshold: 0.0

# 伤害类型。triggers 匹配 AP 本次实际触发的属性 ID/名称。
# attributes 读取常驻属性，不适合用来判断暴击是否触发。
damage-types:
  # 普通伤害。
  normal:
    # 多个类型同时成立时，优先级高的类型胜出。
    priority: 0
    color: '&f'
    prefix: ''
    suffix: ''
    # 依次对应数字 0 到 9，必须正好填写 10 项。
    digits: ['鳀', '霕', '顬', '櫠', '螱', '藁', '黉', '镛', '铴', '韮']
    # 其他字符映射，例如小数点；默认不用。
    symbols: {}

  # 暴击伤害。
  critical:
    priority: 100
    # 是否把原版跳劈也识别为暴击。
    vanilla-critical: true
    # crit 是 AP“暴击几率”的本次触发 ID。
    triggers: ['crit', '暴击']
    # 保持为空，避免拥有暴击几率时每一击都显示暴击。
    attributes: []
    color: '&f'
    # 暴击图片前缀字符。
    prefix: '闊'
    suffix: ''
    # 暴击数字 0 到 9。
    digits: ['騜', '巟', '獚', '奛', '兤', '榥', '宺', '鎤', '琥', '怳']
    symbols: {}

# 未匹配到其他类型时使用普通伤害。
default-type: normal

# 是否在控制台输出伤害类型、AP 触发项、连击数和拾取提示。
debug: false

messages:
  # 独立运行时使用本前缀；检测到 XyCore 时，玩家聊天提示优先使用 XyCore config.yml -> messages.prefix。
  prefix: '&7[&bXyBattleHud&7]&r '
